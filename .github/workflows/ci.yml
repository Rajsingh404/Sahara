# Lint and test all three parts. No audio, datasets or trained models are used: tests that need
# local data are written to run on temporary fixtures; the YAMNet parity test downloads YAMNet
# from TF-Hub and skips itself if that is not possible.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: System audio libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Ruff
        run: ruff check src scripts tests app/tool
      - name: Pytest
        run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - name: Kotlin unit tests (policy fixture shared with pytest, matcher, BLE packets)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug --config-only
          cd android && ./gradlew :app:testDebugUnitTest

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/esp32_wristband/platformio.ini') }}
      - run: pip install platformio
      - name: Build (also checks sound_classes.h against src/config.py)
        working-directory: firmware/esp32_wristband
        run: pio run
