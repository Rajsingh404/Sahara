; SAHARA wristband firmware.
; Build:  pio run          Flash:  pio run -t upload      Logs:  pio device monitor
;
; Uses the pioarduino build of the espressif32 platform (Arduino core 3.x).
; Every package is pinned and downloaded from GitHub releases.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
; Fails the build if include/sound_classes.h drifts from SOUND_CLASSES in src/config.py.
extra_scripts = pre:scripts/check_classes.py
