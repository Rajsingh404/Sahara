<html><head><link rel=stylesheet href=common.css><style>
body{width:940px;height:160px;display:flex;gap:18px}
.p{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;position:relative}
.p>h{display:block;font-size:15px;font-weight:700;color:var(--dark);margin-bottom:6px}
.w{position:absolute;bottom:26px;width:34px;border-radius:4px 4px 0 0}
.t{position:absolute;bottom:8px;font-size:11.5px;color:var(--mut);width:34px;text-align:center}
.th{position:absolute;left:14px;right:150px;border-top:2px dashed #222}
.thl{position:absolute;font-size:12px;font-weight:700}
.al{position:absolute;right:14px;top:44px;width:122px;height:72px;background:var(--red);color:#fff;border-radius:9px;text-align:center;padding-top:10px}
.al b{font-size:19px;display:block}.al span{font-size:12px}
.s{display:flex;gap:8px;margin-top:14px}
.s div{flex:1;height:58px;border-radius:9px;background:#f3efec;text-align:center;padding-top:8px}
.s b{display:block;font-size:22px;color:#6f6965}.s span{font-size:11.5px;color:var(--mut)}
.s .on{background:var(--red)}.s .on b,.s .on span{color:#fff}
.cap{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body>
<div class=p style="width:560px"><h>How one alert fires (2-of-3 example)</h><div id=c></div></div>
<div class=p style="width:362px"><h>Five sensitivity steps = five budgets</h>
<div class=s><div><b>1</b><span>FA/h</span></div><div><b>2</b><span>FA/h</span></div><div class=on><b>4</b><span>default</span></div><div><b>8</b><span>FA/h</span></div><div><b>16</b><span>FA/h</span></div></div>
<div class=cap>Each step is the same model with its own tuned (θ, k) table.</div></div>
<script>
const S=[.12,.2,.15,.62,.4,.71,.68,.3,.1];const base=26,H=78,x0=20;
let h='';S.forEach((s,i)=>{const hot=i>=3&&i<=6&&s>.5;const x=x0+i*42;
h+=`<div class=w style="left:${x}px;height:${s*H}px;background:${s>.5?(i<=5?'#be2f2c':'#e9a9a6'):'#c9c1bb'}"></div><div class=t style="left:${x}px">${(i*0.5).toFixed(1)}s</div>`});
h+=`<div class=th style="bottom:${base+.5*H}px;width:${9*42}px"></div><div class=thl style="left:${x0+9*42+4}px;bottom:${base+.5*H-7}px">θ</div>`;
h+=`<div style="position:absolute;left:${x0+3*42-4}px;width:${3*42}px;bottom:${base-4}px;height:${H+18}px;border:2px solid #992730;border-radius:8px"></div>`;
h+=`<div class=al><b>ALERT</b><span>2 of last 3 windows ≥ θ<br>then 10 s cooldown</span></div>`;
c.innerHTML=h;
</script></body></html>
