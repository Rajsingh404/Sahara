<html><head><link rel=stylesheet href=common.css><style>
body{width:950px;height:455px;position:relative}
.g{position:absolute;left:250px;right:0;top:0;bottom:0}
.wk{position:absolute;top:0;font-size:11.5px;color:var(--mut);text-align:center}
.vl{position:absolute;top:18px;bottom:18px;border-left:1px solid #eee7e2}
.r{position:absolute;left:0;height:40px;display:flex;align-items:center}
.lab{position:absolute;left:0;width:240px;font-size:14px;line-height:1.15}.lab b{display:block;font-size:15px}
.lab span{color:var(--mut);font-size:12px}
.bar{position:absolute;height:26px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;padding-left:8px;white-space:nowrap}
.m{position:absolute;bottom:0;font-size:11.5px;color:var(--dark);font-weight:700}
</style></head><body><div id=x></div>
<script>
const W=700,N=16,cw=W/N,L=250;
const P=[['Research & problem','literature, scope, objectives',1,3,'#992730','Wk 1–3'],
['Design choices','YAMNet, Flutter, ESP32 band',2,2,'#992730',''],
['Dataset strategy & tooling','FSD50K, AudioSet, DESED, scripts',3,6,'#b9524f','Wk 3–6'],
['Data pipeline & baseline','embeddings, Dense head, mixes',7,9,'#be2f2c','Wk 7–9'],
['Alert rule & false-alarm eval','k-of-3, cooldown, budget',9,9,'#be2f2c',''],
['App, TFLite & firmware','Kotlin + Flutter, ESP32 BLE',10,11,'#6f2a2c','Wk 10–11'],
['SAHARA-IN recordings','Mumbai homes, names, backgrounds',12,13,'#3a3533','Wk 12–13'],
['Name calls & caller ID','name spotter, GE2E, open-set',14,14,'#3a3533','Wk 14'],
['Retrain, evaluation, paper','calibration, S24 tests, IEEE paper',15,16,'#8f8782','Wk 15–16']];
let h='';
for(let i=0;i<N;i++){h+=`<div class=wk style="left:${L+i*cw}px;width:${cw}px">W${i+1}</div><div class=vl style="left:${L+i*cw}px"></div>`}
const months=[['Jul',1],['Aug',4],['Sep',8],['Oct',12]];
months.forEach(m=>h+=`<div class=m style="left:${L+(m[1]-1)*cw+3}px">${m[0]}</div>`);
P.forEach((p,i)=>{const y=24+i*45;h+=`<div class=lab style="top:${y}px"><b>${p[0]}</b><span>${p[1]}</span></div>`;
h+=`<div class=bar style="top:${y+5}px;left:${L+(p[2]-1)*cw+2}px;width:${(p[3]-p[2]+1)*cw-4}px;background:${p[4]}">${p[5]}</div>`});
x.innerHTML=h;
</script></body></html>
